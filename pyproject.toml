[project]
name = "ralpher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "rich>=14.3.4",
    "typer>=0.24.1",
]

[project.scripts]
ralpher = "ralpher.main:main"

[tool.hatch.build.targets.wheel]
packages = ["ralpher"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
