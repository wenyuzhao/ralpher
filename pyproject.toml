[project]
name = "ralpher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.12.5",
    "python-frontmatter>=1.1",
    "prompt-toolkit>=3.0",
    "rich>=14.3.4",
    "slugify>=0.0.1",
    "typer>=0.24.1",
    "yaspin>=3.4.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
]

[project.scripts]
ralpher = "ralpher.main:main"

[tool.hatch.build.targets.wheel]
packages = ["ralpher"]
artifacts = ["ralpher/**"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.3.0"]
