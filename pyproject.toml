[project]
name = "ralpher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1",
    "python-frontmatter>=1.1",
    "rich>=14.3.4",
    "typer>=0.24.1",
]

[project.scripts]
ralpher = "ralpher.main:main"

[tool.hatch.build.targets.wheel]
packages = ["ralpher"]
artifacts = ["ralpher/prompts/**"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
